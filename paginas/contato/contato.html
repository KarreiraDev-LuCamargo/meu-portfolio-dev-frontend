<!DOCTYPE html>

<head>

<body>
    <header>
    <nav class="navbar">
      <div class="logo">Luciano Camargo</div>

    </nav>
  </header>
    <!-- Formulário de Contato -->
  <section class="contato">
    <h2>Entre em Contato</h2>
    <form class="form-contato">
      <input type="text" name="nome" placeholder="Seu nome" required>
      <input type="email" name="email" placeholder="Seu e-mail" required>
      <textarea name="mensagem" rows="5" placeholder="Sua mensagem" required></textarea>
      <button type="submit">Enviar Mensagem</button>
    </form>
    <!-- Google Maps -->
  <section class="mapa">
    <h2>Onde me encontrar</h2>
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3675.018865497173!2d-43.25006612393372!3d-22.91325603835211!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x997e65efc1db2f%3A0x71c0e36e2fba81a9!2sR.%20Prof.%20Oliveira%20de%20Menezes%2C%20125%20-%20Rocha%2C%20Rio%20de%20Janeiro%20-%20RJ!5e0!3m2!1spt-BR!2sbr!4v1692621654549!5m2!1spt-BR!2sbr" 
      width="100%" 
      height="350" 
      style="border:0;" 
      allowfullscreen="" 
      loading="lazy">
    </iframe>
  </section>

</body>
