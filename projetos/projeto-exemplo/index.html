<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto Exemplo - Reaproveitando Header/Footer</title>
    <!-- CSS global do portfólio (ajuste o caminho relativo conforme a pasta) -->
    <link rel="stylesheet" href="../../style.css?v=6" />
    <!-- CSS específico do projeto -->
    <link rel="stylesheet" href="./style.css" />
    <!-- Font Awesome (necessário para ícones do footer) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      crossorigin="anonymous"
    />

  <body>
    <div id="header"></div>

    <main style="padding: 40px 20px; max-width: 960px; margin: 0 auto; text-align: left;">
      <h1>Projeto Exemplo</h1>
      <p>
        Esta página demonstra como um projeto em <code>/projetos/projeto-exemplo/</code>
        pode ter seu próprio estilo, mantendo o mesmo header e footer do portfólio.
      </p>
      <p>
        Edite este arquivo à vontade. O CSS local deste projeto está em
        <code>./style.css</code>.
      </p>
    </main>

    <div id="footer"></div>
    <script src="../../include-loader.js"></script>
  </body>
